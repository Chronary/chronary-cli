name: Release Artifact

on:
  push:
    tags:
      - 'v*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create`; id-token + attestations for
    # actions/attest-build-provenance (runs once the mirror is public).
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token (the homebrew-tap push
          # uses its own), so keep it out of .git/config, where install and
          # test scripts could read it (#1659).
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No restored module/build cache in a tag-triggered release job (#1659).
          cache: false

      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          manifest = json.load(open(".chronary-release.json", "r", encoding="utf-8"))
          if manifest["artifact"] != "cli":
              raise SystemExit("Expected artifact cli")
          if manifest["public_tag"] != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Tag mismatch between manifest and workflow ref")
          PY
          test -f RELEASE_NOTES.txt

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist dist/bin

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            workdir="$(mktemp -d)"
            binary="chronary"
            archive="dist/chronary_${version}_${goos}_${goarch}"
            archive_path="${PWD}/${archive}"

            if [ "$goos" = "windows" ]; then
              binary="chronary.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${workdir}/${binary}" ./cmd/chronary

            if [ "$goos" = "windows" ]; then
              (
                cd "$workdir"
                zip -q "${archive_path}.zip" "$binary"
              )
            else
              tar -C "$workdir" -czf "${archive}.tar.gz" "$binary"
            fi

            # Keep linux binaries for nfpm .deb / .rpm packaging.
            if [ "$goos" = "linux" ]; then
              mkdir -p "dist/bin/linux_${goarch}"
              cp "${workdir}/${binary}" "dist/bin/linux_${goarch}/chronary"
            fi

            rm -rf "$workdir"
          done

      - name: Build .deb and .rpm packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Install nfpm (pinned version for reproducibility).
          nfpm_version="2.42.0"
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${nfpm_version}/nfpm_${nfpm_version}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

          for arch in amd64 arm64; do
            cat > /tmp/nfpm.yaml <<YAML
          name: chronary
          arch: ${arch}
          version: ${version}
          platform: linux
          section: utils
          priority: optional
          maintainer: Chronary <support@chronary.ai>
          description: Official Chronary CLI — calendar-as-a-service for AI agents.
          vendor: Chronary
          homepage: https://chronary.ai
          license: Apache-2.0
          contents:
            - src: dist/bin/linux_${arch}/chronary
              dst: /usr/local/bin/chronary
          YAML

            nfpm package --config /tmp/nfpm.yaml \
              --target "dist/chronary_${version}_linux_${arch}.deb" \
              --packager deb
            nfpm package --config /tmp/nfpm.yaml \
              --target "dist/chronary_${version}_linux_${arch}.rpm" \
              --packager rpm
          done

          # Clean up the staging bin dir so it doesn't ship in the release.
          rm -rf dist/bin

      # SBOM (EU CRA Annex I Part II (1), #1634): CycloneDX, in dist/ so the
      # checksums cover it and the GitHub Release attaches it. Fail-closed:
      # these run before anything is published, with no continue-on-error,
      # so no release ships without a valid SBOM.
      # Tool pins and the validator live in scripts/public-release/sbom.mjs.
      - name: Generate SBOM
        env:
          # The tool needs a newer Go than some go.mod files ask for; let the
          # go command fetch the toolchain it declares (checksum-verified).
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          # Application: describe what is linked into each shipped chronary
          # binary. The linked modules differ by OS (Windows pulls in console
          # packages the others don't), so there is one SBOM per target, with
          # the same targets and CGO_ENABLED=0 as "Build release archives".
          # -std lists the Go standard library, which every binary links.
          GOBIN="$RUNNER_TEMP/sbom-bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            SBOM_FILE="dist/chronary_${version}_${goos}_${goarch}_sbom.cdx.json"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              "$RUNNER_TEMP/sbom-bin/cyclonedx-gomod" app -main ./cmd/chronary -json -licenses -std \
              -output-version 1.6 -output "$SBOM_FILE" .
          done
          echo "SBOM_COUNT=${#targets[@]}" >> "$GITHUB_ENV"

      - name: Validate SBOM
        env:
          EXPECTED_NAME: 'github.com/Chronary/chronary-cli'
        run: |
          set -euo pipefail
          # Every per-target SBOM must pass, and there must be one per target.
          # (The loop body is not indented: the embedded validator below is
          # kept byte-for-byte equal to VALIDATE_SBOM_JS.)
          count=0
          for SBOM_FILE in "dist/chronary_${GITHUB_REF_NAME#v}"_*_sbom.cdx.json; do
          count=$((count + 1))
          node - "$SBOM_FILE" "$EXPECTED_NAME" "${GITHUB_REF_NAME#v}" <<'JS'
          const fs = require('fs');
          const [file, expectedName, expectedVersion] = process.argv.slice(2);
          const fail = (msg) => {
            console.error('::error::SBOM ' + file + ': ' + msg);
            process.exit(1);
          };
          let bom;
          try {
            bom = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch (e) {
            fail('not readable JSON (' + e.message + ')');
          }
          if (bom.bomFormat !== 'CycloneDX') fail('bomFormat is ' + JSON.stringify(bom.bomFormat) + ', expected CycloneDX');
          if (!/^1\.[4-9]$/.test(String(bom.specVersion))) fail('unsupported specVersion ' + JSON.stringify(bom.specVersion));
          const main = bom.metadata && bom.metadata.component;
          if (!main) fail('metadata.component is missing');
          const name = [main.group, main.name].filter(Boolean).join('/');
          if (name !== expectedName) fail('main component is ' + JSON.stringify(name) + ', expected ' + JSON.stringify(expectedName));
          const bare = (v) => String(v).replace(/^v/, '');
          if (!expectedVersion) fail('no expected version given');
          if (main.version === undefined || main.version === '') main.version = bare(expectedVersion);
          else if (bare(main.version) !== bare(expectedVersion)) fail('version is ' + main.version + ', expected ' + expectedVersion);
          if (bom.components !== undefined && !Array.isArray(bom.components)) fail('components is not an array');
          fs.writeFileSync(file, JSON.stringify(bom, null, 2) + '\n');
          console.log('SBOM ok: ' + name + '@' + main.version + ', ' + (bom.components || []).length + ' components');
          JS
          done
          if [ "$count" -ne "$SBOM_COUNT" ]; then
            echo "::error::expected $SBOM_COUNT SBOMs (one per target), found $count"
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum chronary_* > sha256sums.txt

      - name: Attest build provenance for release archives
        # Free-tier orgs can only attest in PUBLIC repos. Auto-enables on flip.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/chronary_*.tar.gz
            dist/chronary_*.zip
            dist/chronary_*.deb
            dist/chronary_*.rpm
            dist/chronary_*_sbom.cdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "chronary-cli ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt

      - name: Update homebrew-tap
        # Renders Formula/chronary.rb with the new version + checksums and
        # pushes to Chronary/homebrew-tap so users can `brew install chronary`.
        # Gracefully skips if HOMEBREW_TAP_TOKEN is missing (private-phase
        # dress rehearsals, or if the tap isn't yet wired up).
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping homebrew-tap update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"

          sha_darwin_amd64=$(awk -v f="chronary_${version}_darwin_amd64.tar.gz" '$2 ~ f {print $1}' dist/sha256sums.txt)
          sha_darwin_arm64=$(awk -v f="chronary_${version}_darwin_arm64.tar.gz" '$2 ~ f {print $1}' dist/sha256sums.txt)
          sha_linux_amd64=$(awk  -v f="chronary_${version}_linux_amd64.tar.gz"  '$2 ~ f {print $1}' dist/sha256sums.txt)
          sha_linux_arm64=$(awk  -v f="chronary_${version}_linux_arm64.tar.gz"  '$2 ~ f {print $1}' dist/sha256sums.txt)

          for var in sha_darwin_amd64 sha_darwin_arm64 sha_linux_amd64 sha_linux_arm64; do
            if [ -z "${!var}" ]; then
              echo "Missing checksum for $var. Contents of dist/sha256sums.txt:" >&2
              cat dist/sha256sums.txt >&2
              exit 1
            fi
          done

          cat > /tmp/chronary.rb <<EOF
          class Chronary < Formula
            desc "Official Chronary CLI"
            homepage "https://chronary.ai"
            version "${version}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/Chronary/chronary-cli/releases/download/v${version}/chronary_${version}_darwin_arm64.tar.gz"
                sha256 "${sha_darwin_arm64}"
              end
              on_intel do
                url "https://github.com/Chronary/chronary-cli/releases/download/v${version}/chronary_${version}_darwin_amd64.tar.gz"
                sha256 "${sha_darwin_amd64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/Chronary/chronary-cli/releases/download/v${version}/chronary_${version}_linux_arm64.tar.gz"
                sha256 "${sha_linux_arm64}"
              end
              on_intel do
                url "https://github.com/Chronary/chronary-cli/releases/download/v${version}/chronary_${version}_linux_amd64.tar.gz"
                sha256 "${sha_linux_amd64}"
              end
            end

            def install
              bin.install "chronary"
            end

            test do
              system "#{bin}/chronary", "--version"
            end
          end
          EOF

          workdir=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Chronary/homebrew-tap.git" "$workdir"
          mkdir -p "$workdir/Formula"
          cp /tmp/chronary.rb "$workdir/Formula/chronary.rb"

          cat > "$workdir/CONTRIBUTING.md" <<'EOF'
          # Contributing

          Formula updates here are auto-generated by the Chronary CLI release pipeline. Manual PRs to bump versions or modify the formula will be closed without merge. For bugs, open an Issue.
          EOF

          cat > "$workdir/README.md" <<'EOF'
          # Chronary Homebrew Tap

          Homebrew formula for the [Chronary](https://chronary.ai) CLI.

          ## Install

          ```bash
          brew install chronary/tap/chronary
          ```

          Or in two steps:

          ```bash
          brew tap chronary/tap
          brew install chronary
          ```

          ## Update

          ```bash
          brew update
          brew upgrade chronary
          ```

          ## What's `chronary`?

          A command-line tool for the Chronary calendar-as-a-service API. Source and issues: https://github.com/Chronary/chronary-cli

          ## How this tap stays in sync

          This formula is auto-generated by the Chronary CLI release pipeline on every CLI release. Manual edits will be overwritten on the next release.
          EOF

          cd "$workdir"
          git config user.email "noreply@chronary.ai"
          git config user.name "chronary-release-bot"
          git add Formula/chronary.rb CONTRIBUTING.md README.md
          if git diff --cached --quiet; then
            echo "Formula and CONTRIBUTING unchanged — same version and checksums."
            exit 0
          fi
          git commit -m "chronary ${version}"
          git push origin main
